      <div>
        <h2 class="sec-title rv">궁금한 게 있으면<br><i>물어보셔도 됩니다.</i></h2>
        <form class="ask rv" id="ask-form">
          <label class="mono" for="ask-q">질문</label>
          <textarea id="ask-q" name="question" required maxlength="1000" placeholder="아무거나 물어보세요. 대체로 대답합니다."></textarea>
          <label class="mono" for="ask-name">이름 <span>(안 적어도 됩니다)</span></label>
          <input id="ask-name" name="name" type="text" maxlength="40" placeholder="익명">
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
          <button type="submit" class="rand-btn mono">보내기 →</button>
          <p class="ask-msg" id="ask-msg" aria-live="polite"></p>
        </form>
        <p class="gallery-note mono">* 익명으로 보내집니다. 괜찮은 질문은 답과 함께 FAQ에 올라갑니다.</p>
